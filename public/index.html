<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1E9DF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1A17" media="(prefers-color-scheme: dark)">
<title>Sawmills Stock</title>
<link rel="icon" href="/brand/mono-ink.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
@font-face { font-family:"Tusker"; font-weight:700; font-display:swap; src:url("/fonts/tusker-700.woff2") format("woff2"); }
@font-face { font-family:"Tusker"; font-weight:600; font-display:swap; src:url("/fonts/tusker-600.woff2") format("woff2"); }
@font-face { font-family:"Albiona Soft"; font-weight:500; font-display:swap; src:url("/fonts/albiona-soft-500.woff2") format("woff2"); }

/* Sawmills brand: cream paper, warm ink, one brown for the main action. No lines, pills or shadows: space and fills do the work. */
:root {
  --bg:#F1E9DF; --surface:#FEFBF1; --ink:#413B35;      /* 9.2:1 */
  --accent:#6E4515; --on-accent:#F1E9DF;               /* 6.9:1 */
  --good:#2F6B3A; --bad:#A33A2B;                       /* 6.0:1 and 6.4:1 on --surface */
  --font-ui:"Albiona Soft","Helvetica Neue",Arial,system-ui,sans-serif;
  --font-display:"Tusker","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --r:4px; --tab-h:64px; color-scheme:light dark;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#1D1A17; --surface:#27231F; --ink:#F1E9DF;      /* 14.4:1 */
  --accent:#E2BD86; --on-accent:#1D1A17;               /* 9.8:1 */
  --good:#7FD08A; --bad:#FF9A8A;
} }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:17px; line-height:1.4; font-synthesis:none; }
img { max-width:100%; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

/* ---------- shell ---------- */
.bar { display:flex; align-items:center; justify-content:space-between; padding:calc(env(safe-area-inset-top) + 14px) 20px 4px; max-width:760px; margin:0 auto; }
.bar .logo { height:22px; width:auto; display:block; }
.bar .logo-dark, .mono.logo-dark { display:none; } @media (prefers-color-scheme: dark) { .bar .logo-light, .mono.logo-light { display:none; } .bar .logo-dark, .mono.logo-dark { display:block; } }
.bar .who { font-size:15px; }
.page { max-width:760px; margin:0 auto; padding:8px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 48px); }
h1.title { font-family:var(--font-display); font-weight:700; font-size:48px; line-height:1; text-transform:uppercase; margin:12px 0 16px; }
.showpick { position:relative; display:flex; max-width:100%; margin-bottom:18px; }
.showpick select { appearance:none; -webkit-appearance:none; font:inherit; color:var(--ink); background:var(--surface); border:0; border-radius:var(--r); min-height:48px; padding:0 44px 0 16px; width:100%; text-overflow:ellipsis; }
.showpick::after { content:""; position:absolute; right:18px; top:50%; width:8px; height:8px; border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); transform:translateY(-70%) rotate(45deg); pointer-events:none; }

.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:space-around; background:var(--surface); padding:6px 4px calc(env(safe-area-inset-bottom) + 4px); }
.tabbar button { flex:1; min-width:64px; min-height:52px; border:0; background:none; color:var(--ink); font:inherit; font-size:13px; display:grid; justify-items:center; gap:3px; padding:4px 2px; cursor:pointer; }
.tabbar svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.tabbar button[aria-current="page"] span { text-decoration:underline; text-decoration-thickness:3px; text-decoration-color:var(--accent); text-underline-offset:5px; }
.tabbar .secondary { display:none; }

dialog#more { border:0; padding:0; background:var(--surface); color:var(--ink); width:min(520px, 100%); max-height:85vh; margin:auto auto 0; border-radius:var(--r) var(--r) 0 0; }
dialog#more::backdrop { background:rgba(20,16,12,.5); }
dialog#more h2 { font-family:var(--font-display); font-weight:700; font-size:30px; margin:20px 20px 6px; }
dialog#more .menu button { display:flex; align-items:center; justify-content:space-between; width:100%; min-height:58px; padding:0 20px; border:0; background:none; color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
dialog#more .menu button small { font-size:14px; }
dialog#more .menu { padding-bottom:calc(env(safe-area-inset-bottom) + 12px); }

@media (min-width: 900px) {
  .bar { max-width:none; padding:24px 32px 0 272px; }
  .bar .logo { display:none; }
  .page { max-width:none; margin:0; padding:8px 32px 64px 272px; } .page > section { max-width:880px; }
  .tabbar { top:0; right:auto; bottom:0; width:240px; flex-direction:column; justify-content:flex-start; gap:4px; padding:24px 12px; }
  .tabbar::before { content:""; display:block; height:26px; margin:0 12px 28px; background:url("/brand/logotype-ink.png") left center/auto 100% no-repeat; }
  @media (prefers-color-scheme: dark) { .tabbar::before { background-image:url("/brand/logotype-cream.png"); } }
  .tabbar button { flex:none; display:flex; align-items:center; gap:12px; justify-items:start; min-height:46px; padding:0 12px; font-size:16px; text-align:left; }
  .tabbar svg { width:22px; height:22px; }
  .tabbar .secondary { display:flex; } .tabbar .more-btn { display:none; }
  .tabbar .sep { height:14px; }
  dialog#more { display:none; }
  .signout-side { margin-top:auto; }
}
.tabbar .sep, .tabbar .signout-side { display:none; } @media (min-width:900px) { .tabbar .sep { display:block; } .tabbar .signout-side { display:flex; } }

/* ---------- sign-in ---------- */
.signin { min-height:100vh; display:grid; place-content:center; justify-items:center; gap:20px; text-align:center; padding:24px; }
.signin .mono { width:min(240px, 60vw); }
.signin .app { font-family:var(--font-display); font-weight:700; font-size:34px; margin:0; }
.signin p { margin:0; max-width:30ch; }

/* ---------- components ---------- */
.sub { font-size:15px; margin:0 0 12px; }
.empty { display:grid; place-items:center; min-height:140px; text-align:center; padding:20px; background:var(--surface); border-radius:var(--r); }
.btns { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px; }
.btn { min-height:48px; border:0; background:var(--surface); color:var(--ink); padding:0 20px; border-radius:var(--r); font:inherit; cursor:pointer; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:5px; text-decoration-color:transparent; }
.btn:hover { text-decoration-color:var(--accent); }
.btn.primary { background:var(--accent); color:var(--on-accent); text-decoration:none; }
.btn.small { min-height:44px; padding:0 16px; font-size:15px; }
.btn.danger { color:var(--bad); }
.btn:disabled { cursor:wait; }
.chip { font-size:14px; white-space:nowrap; }
.chip.good { color:var(--good); } .chip.warn { color:var(--accent); } .chip.crit { color:var(--bad); }
.seg { display:inline-flex; gap:22px; margin-bottom:10px; }
.seg button { min-height:44px; border:0; background:none; color:var(--ink); padding:0; font:inherit; cursor:pointer; text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:8px; text-decoration-color:transparent; }
.seg button[aria-pressed="true"] { text-decoration-color:var(--accent); }
.statline { font-size:15px; } .statline.ok { color:var(--good); } .statline.bad { color:var(--bad); }
.stock-top { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:12px; }
.table-wrap { overflow-x:auto; background:var(--surface); border-radius:var(--r); }
table { width:100%; border-collapse:collapse; font-size:15px; }
th { text-align:left; font-weight:500; font-size:14px; padding:14px 12px 6px; white-space:nowrap; }
td { padding:13px 12px; white-space:nowrap; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
td.pos { color:var(--bad); } td.neg { color:var(--good); }

/* form fields */
.sk2-form { display:grid; gap:16px; background:var(--surface); border-radius:var(--r); padding:18px 16px; margin-bottom:16px; }
.sk2-form label, .sk-note { display:grid; gap:6px; font-size:15px; min-width:0; }
.sk2-form input, .sk2-form select, .sk2-form textarea, .sk-note textarea { font:inherit; color:var(--ink); background:var(--bg); border:0; border-radius:var(--r); min-height:48px; padding:10px 14px; width:100%; min-width:0; }
.sk2-in { font:inherit; color:var(--ink); background:var(--surface); border:0; border-radius:var(--r); min-height:48px; padding:10px 14px; width:100%; min-width:0; }
.sk2-form input[type=file] { padding:10px; font-size:15px; }
.sk2-row2 { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); }
.sk2-line { display:grid; gap:10px; grid-template-columns:minmax(0,2fr) minmax(80px,.8fr) minmax(80px,.8fr) auto; align-items:end; }
.sk2-line.nomoney { grid-template-columns:minmax(0,2fr) minmax(80px,.8fr) auto; }
.sk2-sig { width:100%; height:160px; border-radius:var(--r); background:#FFFDF7; touch-action:none; display:block; }

/* lists: rows sit on one block, spacing separates them */
.sk2-list { display:grid; gap:22px; background:var(--surface); border-radius:var(--r); padding:18px 16px; margin-bottom:16px; }
.sk2-item header { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; justify-content:space-between; }
.sk2-item h3 { margin:0; font-family:var(--font-display); font-weight:600; font-size:22px; line-height:1.1; }
.sk2-badges { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.sk2-badges select { font:inherit; min-height:44px; border-radius:var(--r); border:0; background:var(--bg); color:var(--ink); padding:0 10px; }
.sk2-detail { margin-top:12px; display:grid; gap:12px; }
.sk2-detail video, .sk2-detail img { max-width:100%; border-radius:var(--r); background:#000; }
.sk2-detail img.sig { background:#FFFDF7; max-height:160px; }

/* summary: label left, value right */
.sk2-grid { display:grid; gap:18px; background:var(--surface); border-radius:var(--r); padding:18px 16px; margin:0 0 16px; }
.sk2-kpi { display:grid; grid-template-columns:1fr auto; column-gap:12px; align-items:center; }
.sk2-kpi b { grid-row:1 / span 2; grid-column:2; font-family:var(--font-display); font-weight:700; font-size:34px; line-height:1; font-variant-numeric:tabular-nums; }
.sk2-kpi small { font-size:14px; }
.sk2-todo { list-style:none; display:grid; gap:20px; margin:0 0 16px; padding:18px 16px; background:var(--surface); border-radius:var(--r); }
.sk2-todo li { display:flex; gap:14px; align-items:center; }
.sk2-tick { width:26px; height:26px; border-radius:var(--r); background:var(--bg); display:inline-grid; place-items:center; font-size:15px; flex:none; }
.sk2-tick.done { background:var(--good); color:var(--surface); }

/* counting: the job this app does most. Big numbers, thumb-sized steppers. */
.sk2-cat { font-family:var(--font-display); font-weight:600; font-size:24px; line-height:1.1; margin:28px 0 10px; }
.sk2-cntlist { display:grid; gap:16px; background:var(--surface); border-radius:var(--r); padding:14px 12px 14px 16px; }
.sk2-cnt { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; }
.sk2-cnt small { display:block; font-size:14px; }
.stepper { display:flex; align-items:center; gap:6px; }
.stepper .step { width:48px; height:48px; border-radius:var(--r); border:0; background:var(--bg); color:var(--ink); font-size:26px; line-height:1; cursor:pointer; }
.stepper input { width:84px; text-align:center; font-family:var(--font-display); font-weight:700; font-size:32px; min-height:48px; padding:0 4px; border:0; border-radius:var(--r); background:var(--bg); color:var(--ink); font-variant-numeric:tabular-nums; }
.sk2-savebar { position:sticky; bottom:calc(var(--tab-h) + env(safe-area-inset-bottom)); display:flex; gap:12px; align-items:center; margin-top:16px; padding:14px 0; background:var(--bg); }
@media (min-width:900px) { .sk2-savebar { bottom:0; } }

.sk2-prodtbl input, .sk2-prodtbl select { font:inherit; font-size:15px; padding:8px; border-radius:var(--r); border:0; background:var(--bg); color:var(--ink); width:100%; min-width:80px; min-height:44px; }
.sk2-prodtbl td { white-space:normal; padding:6px; }
.sk2-bar { height:8px; border-radius:var(--r); background:var(--bg); overflow:hidden; margin-top:6px; }
.sk2-bar i { display:block; height:100%; background:var(--accent); }
@media (max-width:640px) { .hide-sm { display:none; } .table-wrap td:first-child { white-space:normal; } .table-wrap th, .table-wrap td { padding-left:10px; padding-right:10px; } .sk2-line, .sk2-line.nomoney { grid-template-columns:1fr 1fr; } .sk2-line > :first-child { grid-column:1 / -1; } h1.title { font-size:42px; } }
</style>
</head>
<body>
<section id="signin" class="signin">
  <img class="mono logo-light" src="/brand/mono-ink.png" alt="Sawmills">
  <img class="mono logo-dark" src="/brand/mono-cream.png" alt="Sawmills">
  <h1 class="app">Stock</h1>
  <p>Sign in to count, receive and order.</p>
  <button class="btn primary" id="signin-btn" style="min-width:200px">Sign in</button>
  <p class="statline bad" id="signin-msg" role="alert"></p>
</section>

<div id="app" hidden>
  <header class="bar">
    <img class="logo logo-light" src="/brand/logotype-ink.png" alt="Sawmills">
    <img class="logo logo-dark" src="/brand/logotype-cream.png" alt="Sawmills">
    <span class="who" id="who"></span>
  </header>
  <main class="page">
    <section id="view-stock"><div id="sk-root"></div></section>
    <section id="view-team" hidden><h1 class="title">Team</h1><div id="team-body"></div></section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <dialog id="more" aria-label="More"><div class="grab"></div><h2>More</h2><div class="menu" id="more-menu"></div></dialog>
</div>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="/match.js"></script>
<script src="/stock-calc.js"></script>
<script src="/app.js"></script>
<script src="/stock.js"></script>
</body>
</html>
